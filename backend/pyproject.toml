[project]
name = "zaikokanri-backend"
version = "0.2.0"
description = "在庫管理システム バックエンド (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.11"
# 直接の依存だけをここに書く。実際に入れる版は requirements*.lock（ハッシュ付き）で固定する。
# ロックの作り直し（公開7日未満の版は使わない＝開発憲章 1章）:
#   uv pip compile pyproject.toml --universal --generate-hashes --exclude-newer "7 days" -o requirements.lock
#   uv pip compile pyproject.toml --universal --generate-hashes --exclude-newer "7 days" --extra dev -o requirements-dev.lock
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "sqlalchemy>=2.0.40",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "bcrypt>=4.3",
  "slowapi>=0.1.9",
  "openai>=1.100",
  "fpdf2>=2.8",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.12",
  "pip-audit>=2.9",
]

[tool.uv.pip]
exclude-newer = "7 days"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() パターンを許可

[tool.pytest.ini_options]
testpaths = ["tests"]
# パッケージとして入れていなくても app / tests を読み込めるようにする（CI はロックの依存だけを入れて pytest を直接呼ぶ）
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
